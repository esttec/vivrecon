# Production stack for vivrecon.com — database + backend + frontend + HTTPS proxy.
# Secrets come from a .env file that sits next to this file (never commit .env).
# Run with:  docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vivrecon
      POSTGRES_USER: vivrecon
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend/vivrecon
    depends_on:
      - db
    environment:
      DB_URL: jdbc:postgresql://db:5432/vivrecon
      DB_USER: vivrecon
      DB_PASS: ${DB_PASS}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_MONTHLY: ${STRIPE_PRICE_MONTHLY}
      STRIPE_PRICE_YEARLY: ${STRIPE_PRICE_YEARLY}
      APP_BASE_URL: https://vivrecon.com
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      MAIL_FROM: ${MAIL_FROM:-}
    restart: unless-stopped

  # Own outgoing mail server (send-only, signs mail with DKIM). The backend reaches it as host "mail".
  mail:
    image: boky/postfix:latest
    hostname: mail.vivrecon.com
    environment:
      ALLOWED_SENDER_DOMAINS: vivrecon.com
      POSTFIX_myhostname: mail.vivrecon.com
      DKIM_AUTOGENERATE: "true"
    volumes:
      - dkim_keys:/etc/opendkim/keys
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - web
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  dkim_keys:
  pg_data:
  caddy_data:
  caddy_config:
